* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {

main { max-width: 1120px; margin: 0 auto; padding: 40px 16px 64px; }

  padding: 16px;
  min-width: 0;

.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.key-line { display: inline-block; width: 14px; height: 2px; border-radius: 1px; }

.chart { width: 100%; }

.chart svg:focus-visible { outline: 2px solid var(--series-1); outline-offset: 4px; border-radius: 4px; }
svg .gl { stroke: var(--gridline); stroke-width: 1; }
svg .ax { stroke: var(--axis); stroke-width: 1; }
svg .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
svg .axis-title { fill: var(--muted); font-size: 11px; }
svg .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
svg .dot { stroke: var(--surface); stroke-width: 2; }
svg .whisker { stroke-width: 1.5; stroke-linecap: round; opacity: 0.4; }
svg .end-label, svg .row-label { fill: var(--ink-2); font-size: 12px; }
svg .value-label { fill: var(--ink); font-size: 12px; font-variant-numeric: tabular-nums; }
svg .note { fill: var(--muted); font-size: 12px; }
svg .crosshair { stroke: var(--axis); stroke-width: 1; }
svg .hit { fill: transparent; pointer-events: all; }
svg .hit.x { cursor: crosshair; }
svg .hit:focus { outline: none; }
svg .hit:focus-visible { stroke: var(--series-1); stroke-width: 2; }
.tooltip {
  position: fixed;
  z-index: 10;
  pointer-events: none;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
  font-size: 12px;
  min-width: 160px;
  max-width: min(340px, calc(100vw - 16px));

.tip-title { color: var(--muted); margin-bottom: 4px; }
.tip-row { display: grid; grid-template-columns: 14px auto 1fr; align-items: center; column-gap: 8px; }
.tip-row strong { font-variant-numeric: tabular-nums; font-weight: 600; }
.tip-name { color: var(--ink-2); }
.tip-detail { grid-column: 2 / -1; color: var(--muted); margin-bottom: 4px; }
details.table-view { margin-top: 8px; }
details.table-view summary { cursor: pointer; color: var(--ink-2); font-size: 12px; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--gridline); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--ink-2); font-weight: 600; }
td .muted { color: var(--muted); }
.warnings { border: 1px solid var(--border); border-left: 3px solid var(--warning); background: var(--surface); border-radius: 8px; padding: 12px 16px; margin: 16px 0; }
.warnings h2 { font-size: 14px; margin: 0 0 4px; }
.warnings ul { margin: 0; padding-left: 18px; color: var(--ink-2); overflow-wrap: anywhere; }
.meta { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; font-size: 13px; }
.meta dt { color: var(--muted); }
.meta dd { margin: 0; color: var(--ink-2); overflow-wrap: anywhere; }
nav.toc { display: flex; flex-wrap: wrap; gap: 8px; margin: 24px 0 0; }
nav.toc a { color: var(--ink-2); text-decoration: none; border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; font-size: 12px; background: var(--surface); }

footer { margin-top: 56px; color: var(--ink-2); font-size: 13px; }
footer ul { padding-left: 18px; max-width: 80ch; }
@media (max-width: 520px) {

// Color follows the implementation's position in the run, so it is identical in every chart.
const IMPLS = DATA.impls;
const color = impl => `var(--series-${IMPLS.indexOf(impl) + 1})`;
const implsIn = points => IMPLS.filter(impl => points.some(p => p.impl === impl));
const SVG_NS = "http://www.w3.org/2000/svg";

function el(tag, attrs = {}, text) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  return e;
}
function sv(tag, attrs = {}, text) {
  const e = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  return e;
}

// ---- number formatting (mirrors report.py)
const sig = v => String(Number(v.toPrecision(3)));
function fmtSI(v) {
  if (v == null) return "–";
  for (const [d, s] of [[1e9, "B"], [1e6, "M"], [1e3, "K"]]) if (Math.abs(v) >= d) return sig(v / d) + s;
  return sig(v);
}
function fmtNs(v) {
  if (v == null) return "–";
  if (v === 0) return "0";
  for (const [d, u] of [[1e9, "s"], [1e6, "ms"], [1e3, "µs"]]) if (v >= d) return `${sig(v / d)} ${u}`;
  return `${Math.round(v)} ns`;
}
function fmtBytes(v) {
  if (v == null) return "–";
  if (v === 0) return "0";
  for (const [d, u] of [[1 << 30, "GiB"], [1 << 20, "MiB"], [1 << 10, "KiB"]]) if (v >= d) return `${sig(v / d)} ${u}`;
  return `${Math.round(v)} B`;
}
const pct = v => `±${v.toFixed(1)}%`;
const noisy = p => p.cv_pct > DATA.cvWarn;

function niceScale(max, ticks = 4) {
  if (!(max > 0)) max = 1;
  const raw = max / ticks;
  const pow = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(k => k * pow).find(s => s >= raw * 0.999);
  return { max: Math.ceil(max / step - 1e-9) * step, step };
}

// ---- tooltip
const tip = document.getElementById("tooltip");
function showTip(cx, cy, title, rows) {
  tip.replaceChildren(el("div", { class: "tip-title" }, title));
  for (const r of rows) {
    const row = el("div", { class: "tip-row" });
    const key = el("span", { class: "key-line" });
    key.style.background = color(r.impl);
    row.append(key, el("strong", {}, r.value), el("span", { class: "tip-name" }, r.impl));
    if (r.detail) row.append(el("span", { class: "tip-detail" }, r.detail));
    tip.append(row);
  }
  tip.hidden = false;
  const b = tip.getBoundingClientRect();
  let left = cx + 14, top = cy + 14;
  if (left + b.width > innerWidth - 8) left = cx - 14 - b.width;
  if (top + b.height > innerHeight - 8) top = cy - 14 - b.height;
  tip.style.left = `${Math.max(8, left)}px`;
  tip.style.top = `${Math.max(8, top)}px`;
}
const hideTip = () => { tip.hidden = true; };

// ---- building blocks
function legend(kind, impls = IMPLS) {
  const box = el("div", { class: "legend" });
  for (const impl of impls) {
    const item = el("span", { class: "legend-item" });
    const key = el("span", { class: kind === "rect" ? "key-rect" : "key-line" });
    key.style.background = color(impl);
    item.append(key, document.createTextNode(impl));
    box.append(item);
  }
  return box;
}

function card(parent, title, subtitle, legendKind, impls) {
  const c = el("div", { class: "card" });
  c.append(el("h3", {}, title));
  if (subtitle) c.append(el("p", { class: "card-sub" }, subtitle));
  c.append(legend(legendKind, impls));
  parent.append(c);
  return c;
}

function missingNote(c, points) {
  for (const impl of implsIn(points)) {
    const mine = points.filter(p => p.impl === impl);
    if (mine.length && mine.every(p => p.status !== "ok")) {
      const p = mine[0];
      c.append(el("p", { class: "card-note" }, `${impl}: ${p.status}${p.reason ? ` (${p.reason})` : ""}`));
    }
  }
}

const threadsOf = points => [...new Set(points.map(p => p.threads))].sort((a, b) => a - b);
const findPoint = (points, impl, t) => points.find(p => p.impl === impl && p.threads === t);

function tableView(c, points, cell) {
  const details = el("details", { class: "table-view" });
  details.append(el("summary", {}, "Table"));
  const table = el("table");
  const impls = implsIn(points);
  const head = el("tr");
  head.append(el("th", {}, "Threads"));
  for (const impl of impls) head.append(el("th", {}, impl));
  table.append(el("thead"));
  table.tHead.append(head);
  const body = el("tbody");
  for (const t of threadsOf(points)) {
    const tr = el("tr");
    tr.append(el("td", {}, String(t)));
    for (const impl of impls) {
      const p = findPoint(points, impl, t);
      const td = el("td");
      if (p && p.status === "ok") td.textContent = cell(p);
      else td.append(el("span", { class: "muted" }, p ? p.status : "–"));
      tr.append(td);
    }
    body.append(tr);
  }
  table.append(body);
  const wrap = el("div", { class: "table-wrap" });
  wrap.append(table);
  details.append(wrap);
  c.append(details);
}

function responsive(host, draw) {
  let lastWidth = 0;
  const run = () => {
    const w = Math.floor(host.clientWidth);
    if (!w || w === lastWidth) return;
    lastWidth = w;
    draw(w);
  };
  new ResizeObserver(run).observe(host);
  run();
}

// ---- line chart: value by thread count, one line per implementation
function lineChart(c, cfg) {
  const threads = threadsOf(cfg.points);
  const series = implsIn(cfg.points).map(impl => ({
    impl,
    pts: threads.map(t => {
      const row = findPoint(cfg.points, impl, t);
      const v = row && row.status === "ok" ? cfg.value(row) : null;
      return { row, v: v ?? null };
    }),
  }));
  const host = el("div", { class: "chart" });
  c.append(host);

  responsive(host, W => {
    const H = 240, m = { top: 12, right: 84, bottom: 44, left: 52 }, inset = 16;
    const pw = W - m.left - m.right, ph = H - m.top - m.bottom;
    const tops = series.flatMap(s => s.pts.filter(p => p.v != null).map(p => cfg.whisker ? Math.max(p.v, p.row.ops_max ?? 0) : p.v));
    const { max, step } = niceScale(Math.max(0, ...tops));
    const x = i => m.left + inset + (threads.length === 1 ? (pw - 2 * inset) / 2 : i * (pw - 2 * inset) / (threads.length - 1));
    const y = v => m.top + ph - (v / max) * ph;

    const svg = sv("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", tabindex: 0, "aria-label": `${cfg.label}. Use left and right arrow keys to read values.` });
    for (let v = 0; v <= max + step / 2; v += step) {
      svg.append(sv("line", { x1: m.left, x2: W - m.right, y1: y(v), y2: y(v), class: v === 0 ? "ax" : "gl" }));
      svg.append(sv("text", { x: m.left - 8, y: y(v) + 4, class: "tick", "text-anchor": "end" }, cfg.fmt(v)));
    }
    threads.forEach((t, i) => svg.append(sv("text", { x: x(i), y: m.top + ph + 18, class: "tick", "text-anchor": "middle" }, String(t))));
    svg.append(sv("text", { x: m.left + pw / 2, y: H - 6, class: "axis-title", "text-anchor": "middle" }, "Worker threads (= pinned CPUs)"));

    const cross = sv("line", { y1: m.top, y2: m.top + ph, class: "crosshair", visibility: "hidden" });
    svg.append(cross);

    for (const s of series) {
      const stroke = color(s.impl);
      if (cfg.whisker) {
        s.pts.forEach((p, i) => {
          if (p.v != null && p.row.ops_min != null) svg.append(sv("line", { x1: x(i), x2: x(i), y1: y(p.row.ops_min), y2: y(p.row.ops_max), stroke, class: "whisker" }));
        });
      }
      let d = "", penDown = false;
      s.pts.forEach((p, i) => {
        if (p.v == null) { penDown = false; return; }
        d += `${penDown ? "L" : "M"}${x(i)},${y(p.v)}`;
        penDown = true;
      });
      if (d) svg.append(sv("path", { d, stroke, class: "line" }));
      s.pts.forEach((p, i) => { if (p.v != null) svg.append(sv("circle", { cx: x(i), cy: y(p.v), r: 4, fill: stroke, class: "dot" })); });
    }

    // Direct labels at the right edge; colliding labels are dropped (legend + tooltip carry them).
    const last = threads.length - 1;
    const ends = series.filter(s => s.pts[last].v != null).map(s => ({ impl: s.impl, yy: y(s.pts[last].v) }));
    for (const e of ends) {
      if (ends.some(o => o !== e && Math.abs(o.yy - e.yy) < 14)) continue;
      svg.append(sv("text", { x: x(last) + 10, y: e.yy + 4, class: "end-label" }, e.impl));
    }

    const show = (i, cx, cy) => {
      cross.setAttribute("x1", x(i));
      cross.setAttribute("x2", x(i));
      cross.setAttribute("visibility", "visible");
      showTip(cx, cy, `${threads[i]} thread${threads[i] === 1 ? "" : "s"}`, series.map(s => {
        const p = s.pts[i];
        if (p.v == null) return { impl: s.impl, value: p.row ? p.row.status : "no data", detail: p.row?.reason ?? null };
        return { impl: s.impl, value: cfg.fmt(p.v), detail: cfg.detail ? cfg.detail(p.row) : null };
      }));
    };
    const hide = () => { cross.setAttribute("visibility", "hidden"); hideTip(); };
    const hit = sv("rect", { x: m.left, y: m.top, width: pw, height: ph, class: "hit x" });
    svg.append(hit);
    hit.addEventListener("pointermove", e => {
      const px = e.clientX - svg.getBoundingClientRect().left;
      let best = 0;
      threads.forEach((_, i) => { if (Math.abs(x(i) - px) < Math.abs(x(best) - px)) best = i; });
      show(best, e.clientX, e.clientY);
    });
    hit.addEventListener("pointerleave", hide);
    let focus = last;
    const showFocus = () => { const r = svg.getBoundingClientRect(); show(focus, r.left + x(focus), r.top + m.top); };
    svg.addEventListener("focus", showFocus);
    svg.addEventListener("blur", hide);
    svg.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft") focus = Math.max(0, focus - 1);
      else if (e.key === "ArrowRight") focus = Math.min(last, focus + 1);
      else return;
      e.preventDefault();
      showFocus();
    });
    host.replaceChildren(svg);
  });
}

// ---- horizontal bar chart: one bar per implementation at the highest thread count
function barChart(c, cfg) {
  const t = Math.max(...threadsOf(cfg.points));

    }
    rows.forEach((r, i) => {
      const top = m.top + i * rowH + (rowH - barH) / 2;

        svg.append(sv("text", { x: x(0) + 8, y: mid, class: "note" }, r.row ? r.row.status : "no data"));
      } else {
        const x0 = x(0), x1 = Math.max(x(r.v), x0 + 1), rad = Math.min(4, x1 - x0, barH / 2);
        const d = `M${x0},${top}H${x1 - rad}Q${x1},${top} ${x1},${top + rad}V${top + barH - rad}Q${x1},${top + barH} ${x1 - rad},${top + barH}H${x0}Z`;
        svg.append(sv("path", { d, fill: color(r.impl) }));
        svg.append(sv("text", { x: x1 + 6, y: mid, class: "value-label" }, cfg.fmt(r.v)));
      }
      const hit = sv("rect", { x: 0, y: m.top + i * rowH, width: W, height: rowH, class: "hit", tabindex: 0, "aria-label": `${r.impl}: ${r.v == null ? (r.row ? r.row.status : "no data") : cfg.fmt(r.v)}` });
      const show = (cx, cy) => showTip(cx, cy, `${t} thread${t === 1 ? "" : "s"}`, [
        r.v == null
          ? { impl: r.impl, value: r.row ? r.row.status : "no data", detail: r.row?.reason ?? null }
          : { impl: r.impl, value: cfg.fmt(r.v), detail: cfg.detail ? cfg.detail(r.row) : null },
      ]);
      hit.addEventListener("pointermove", e => show(e.clientX, e.clientY));
      hit.addEventListener("pointerleave", hideTip);
      hit.addEventListener("focus", () => { const b = svg.getBoundingClientRect(); show(b.left + x(r.v ?? 0), b.top + top); });
      hit.addEventListener("blur", hideTip);
      svg.append(hit);
    });
    svg.append(sv("line", { x1: x(0), x2: x(0), y1: m.top, y2: plotBottom, class: "ax" }));
    host.replaceChildren(svg);
  });
}

// ---- page
const meta = DATA.meta;
const bases = [...new Set(IMPLS.map(i => i.split("+")[0]))];
document.getElementById("title").textContent = bases.map(b => b[0].toUpperCase() + b.slice(1)).join(" vs ") +
  (IMPLS.some(i => i.includes("+")) ? " (with Tokio variants)" : "");
document.getElementById("subtitle").textContent =
  `Profile “${meta.profile}”, started ${meta.started_at}. Each point is the median of ${meta.reps} measured runs ` +
  `(after ${meta.warmup} warm-up${meta.warmup === 1 ? "" : "s"}) per implementation, with run order shuffled every round.`;
document.getElementById("global-legend").replaceWith(legend("line"));

if (meta.warnings.length) {
  const box = el("div", { class: "warnings", role: "note" });
  box.append(el("h2", {}, `⚠ Warning${meta.warnings.length > 1 ? "s" : ""}: results may be noisy`));
  const ul = el("ul");
  for (const w of meta.warnings) ul.append(el("li", {}, w));
  box.append(ul);
  document.getElementById("warnings").append(box);
}

// Overview table
(() => {
  const table = el("table");
  const head = el("tr");
  for (const h of ["Test", "Threads", ...IMPLS, "Unit"]) head.append(el("th", {}, h));
  table.append(el("thead"));
  table.tHead.append(head);
  const body = el("tbody");
  for (const sec of DATA.sections) {
    const lowerBetter = sec.workload === "idle";
    const value = p => lowerBetter ? p.bytes_per_task : p.ops_median;
    const fmt = lowerBetter ? fmtBytes : fmtSI;
    for (const z of sec.sizes) {
      const t = Math.max(...threadsOf(z.points));
      const vals = IMPLS.map(impl => { const p = findPoint(z.points, impl, t); return p && p.status === "ok" ? value(p) : null; });
      const present = vals.filter(v => v != null);
      const best = present.length > 1 ? (lowerBetter ? Math.min : Math.max)(...present) : null;
      const tr = el("tr");
      const name = el("td");
      const link = el("a", { href: `#${sec.workload}` }, sec.title);
      link.style.color = "inherit";
      name.append(link, el("span", { class: "muted" }, ` · ${fmtSI(z.size)}`));
      tr.append(name, el("td", {}, String(t)));
      IMPLS.forEach((impl, i) => {
        const td = el("td");
        if (vals[i] == null) {
          const p = findPoint(z.points, impl, t);
          td.append(el("span", { class: "muted" }, p ? p.status : "–"));
        } else if (vals[i] === best) {
          td.append(el("strong", {}, fmt(vals[i])));
        } else {
          td.textContent = fmt(vals[i]);
        }
        tr.append(td);
      });
      const unit = el("td");
      unit.append(el("span", { class: "muted" }, lowerBetter ? `${sec.unit} (lower is better)` : sec.unit));
      tr.append(unit);
      body.append(tr);
    }
  }
  table.append(body);
  document.getElementById("overview").append(table);
})();

// Sections
const toc = document.getElementById("toc");
const root = document.getElementById("sections");
for (const sec of DATA.sections) {
  toc.append(el("a", { href: `#${sec.workload}` }, sec.title));
  const section = el("section", { id: sec.workload });
  const h2 = el("h2", {}, sec.title);
  h2.append(el("code", {}, sec.workload));
  section.append(h2, el("p", { class: "section-blurb" }, sec.blurb));
  const grid = el("div", { class: "grid" });
  section.append(grid);
  root.append(section);

  if (sec.workload === "idle") {
    const max = Math.max(0, ...sec.sizes.flatMap(z => z.points.filter(p => p.status === "ok").map(p => p.bytes_per_task)));
    for (const z of sec.sizes) {
      const c = card(grid, `${z.size.toLocaleString("en-US")} idle tasks`, "Resident memory added per task · lower is better · same scale across sizes", "rect", implsIn(z.points));
      barChart(c, {
        points: z.points, max, fmt: fmtBytes, value: p => p.bytes_per_task,
        label: `Memory per idle task with ${z.size} tasks`,
        detail: p => `${pct(p.cv_pct)} across ${p.runs} runs`,
      });
      missingNote(c, z.points);
      tableView(c, z.points, p => `${fmtBytes(p.bytes_per_task)} ${pct(p.cv_pct)}`);
    }
    continue;
  }

  for (const z of sec.sizes) {
    const c = card(grid, `Throughput · ${z.size.toLocaleString("en-US")} ops`, `${sec.unit} · higher is better · faint bar = min to max across runs`, "line", implsIn(z.points));
    lineChart(c, {
      points: z.points, whisker: true, fmt: fmtSI, value: p => p.ops_median,
      label: `${sec.title} throughput by thread count`,
      detail: p => `${pct(p.cv_pct)}${noisy(p) ? " ⚠ noisy" : ""} · range ${fmtSI(p.ops_min)}–${fmtSI(p.ops_max)} · ${p.runs} runs`,
    });
    missingNote(c, z.points);
    tableView(c, z.points, p => `${fmtSI(p.ops_median)} ${pct(p.cv_pct)}${noisy(p) ? " ⚠" : ""}`);

    if (sec.workload === "pingpong") {
      const every = meta.params?.pingpong?.["sample-every"] ?? 16;
      for (const [key, label] of [["lat_p50_ns", "p50"], ["lat_p99_ns", "p99"]]) {
        const lc = card(grid, `Round-trip latency ${label}`, `Every ${every}th round trip sampled · lower is better`, "line", implsIn(z.points));
        lineChart(lc, {
          points: z.points, whisker: false, fmt: fmtNs, value: p => p[key],
          label: `Ping-pong ${label} latency by thread count`,
          detail: p => `p50 ${fmtNs(p.lat_p50_ns)} · p99 ${fmtNs(p.lat_p99_ns)} · p99.9 ${fmtNs(p.lat_p999_ns)}`,
        });
        tableView(lc, z.points, p => key === "lat_p50_ns" ? fmtNs(p.lat_p50_ns) : `${fmtNs(p.lat_p99_ns)} (p99.9 ${fmtNs(p.lat_p999_ns)})`);
      }
    }
  }
}

// Machine and method
(() => {
  const dl = document.getElementById("machine");
  const crates = Object.entries(meta.crates || {}).map(([k, v]) => `${k} ${v}`).join(", ");
  const rows = [
    ["CPU", `${meta.cpu_model ?? "unknown"} (${meta.logical_cpus} logical CPUs)`],
    ["Governor", `${meta.governors.join(", ") || "unknown"}${meta.energy_performance_preference.length ? ` · EPP ${meta.energy_performance_preference.join(", ")}` : ""}`],
    ["Pinning order", meta.cpu_order.join(", ")],
    ["Kernel", meta.kernel],
    ["Memory", `${Math.round(meta.mem_total_kb / 1024).toLocaleString("en-US")} MiB total, ${Math.round(meta.mem_available_kb / 1024).toLocaleString("en-US")} MiB free at start`],
    ["Load at start", String(meta.load_avg_1m)],
    ["Rust", meta.rustc ?? "unknown"],
    ["Go", meta.go ?? "unknown"],
    ["Crates", crates || "unknown"],
    ["Shuffle seed", String(meta.seed)],
  ];
  for (const [k, v] of rows) dl.append(el("dt", {}, k), el("dd", {}, v));

  const notes = [
    "Every run is a fresh process pinned with taskset to exactly N logical CPUs, one per physical core before any SMT sibling. Tokio worker_threads, Crossbeam pool size and GOMAXPROCS are all set to N.",
    "Each result is checked: a checksum must match the expected value (or, for the CPU test, match the other implementations) or the run is rejected.",
    "Tokio's own mpsc channel has one receiver, so the many-receivers test uses the async-channel crate.",
    "Every implementation uses the same channel capacity in a test: 1024 for the channel tests, 1 for their capacity-1 versions and for ping-pong (Tokio channels cannot have zero capacity).",
    "tokio-tuned is a separate program (rust/tokio-tuned-bench): mimalloc, kanal channels, batched receives, spawning without JoinHandles and parking_lot::Mutex, each kept only where screening showed a gain.",
    "Crossbeam has no lightweight tasks: spawn and idle tests use one OS thread per task and are skipped above 20,000 threads.",
    "Idle memory is resident memory (VmRSS) added after tasks park; kernel thread structures are not counted, which flatters OS threads.",
    "Go numbers include its garbage collector; the CPU test also reflects each compiler's code generation, not only the scheduler.",
  ];
  const ul = document.getElementById("method");
  for (const n of notes) ul.append(el("li", {}, n));
  for (const [v, help] of Object.entries(meta.variant_help || {})) ul.append(el("li", {}, `Tokio variant “${v}”: ${help}.`));
})();
</script>
</body>
</html>
